<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2;url={{ url }}">
    <title>{{ title }} - CYBERRESEARCH</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(180deg, #07111f 0%, #0b1728 100%);
            color: #eef4ff;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; flex-direction: column; gap: 1.5rem;
        }
        .loader {
            width: 48px; height: 48px;
            border: 3px solid rgba(59,130,246,0.18);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .text { font-size: 1.1rem; color: #89a0b7; }
        .link { color: #3b82f6; text-decoration: none; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div class="text">正在跳转到板块资金监控台...</div>
    <a class="link" href="{{ url }}">如果未自动跳转，点击这里</a>
</body>
</html>
