<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票分组</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #00041a;
    --bg-card: rgba(0,12,42,.9);
    --border: rgba(0,255,255,.12);
    --blue: #00ffff;
    --green: #00ff88;
    --red: #ff0077;
    --t1: #e0f2ff;
    --t2: #a0c4ff;
    --t3: #4a6388;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--t1); min-height:100vh; }
.container { max-width:1200px; margin:0 auto; padding:1rem; }
nav { display:flex; align-items:center; gap:1rem; padding:.75rem 0; border-bottom:1px solid var(--border); margin-bottom:1.5rem; }
nav a { color:var(--t2); text-decoration:none; font-size:.85rem; font-weight:500; }
nav a:hover { color:var(--blue); }
nav .brand { font-weight:700; font-size:1rem; color:var(--t1); }
.category-nav { display:flex; flex-wrap:wrap; gap:.5rem; margin:1rem 0; }
.category-btn { padding:.4rem .8rem; border-radius:20px; border:1px solid var(--border); background:var(--bg-card); color:var(--t2); cursor:pointer; font-size:.78rem; font-weight:600; transition:all .2s; }
.category-btn:hover, .category-btn.active { background:var(--blue); color:#fff; border-color:var(--blue); }
.sort-nav { display:flex; flex-wrap:wrap; gap:.5rem; margin:.5rem 0 1rem 0; align-items:center; }
.sort-label { font-size:.78rem; color:var(--t3); margin-right:.3rem; }
.sort-btn { padding:.35rem .7rem; border-radius:16px; border:1px solid var(--border); background:var(--bg-card); color:var(--t2); cursor:pointer; font-size:.75rem; font-weight:500; transition:all .2s; }
.sort-btn:hover { border-color:var(--blue); color:var(--t1); }
.sort-btn.active { background:var(--blue); color:#fff; border-color:var(--blue); }
.groups-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:1rem; margin:1rem 0; }
.group-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:1.25rem; cursor:pointer; transition:all .2s; position:relative; }
.group-card:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.3); }
.group-avg-change {
    position:absolute;
    top:.75rem;
    right:.75rem;
    font-size:.8rem;
    font-weight:700;
    padding:.25rem .55rem;
    border-radius:8px;
    font-family:'Inter', monospace;
    z-index:2;
}
.group-avg-change.up {
    background:rgba(16,185,129,.15);
    color:var(--green);
    border:1px solid rgba(16,185,129,.3);
}
.group-avg-change.down {
    background:rgba(239,68,68,.15);
    color:var(--red);
    border:1px solid rgba(239,68,68,.3);
}
.group-avg-change.flat {
    background:rgba(148,163,184,.1);
    color:var(--t2);
    border:1px solid rgba(148,163,184,.2);
}
.group-stocks { display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.75rem; }
.stock-tag { padding:.2rem .5rem; border-radius:4px; font-size:.72rem; text-decoration:none; white-space:nowrap; }
.header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem; flex-wrap:wrap; gap:.5rem; }
.stock-tag-change { font-size:.65rem; margin-left:.25rem; font-weight:600; }
.stock-tag-change.up { color:var(--green); }
.stock-tag-change.down { color:var(--red); }
.loading-overlay {
    position:fixed; inset:0; background:rgba(10,14,23,.85);
    display:flex; align-items:center; justify-content:center; z-index:999;
    backdrop-filter:blur(4px);
}
.loading-box { text-align:center; }
.loading-spinner {
    width:36px; height:36px; border:3px solid rgba(0,255,255,.2);
    border-top-color:var(--blue); border-radius:50%;
    animation:spin 1s linear infinite; margin:0 auto .75rem;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { font-size:.85rem; color:var(--t2); }
@media(max-width:768px){ .groups-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<nav>
    <a href="/" class="brand">📊 Stock Research</a>
    <a href="/">首页</a>
    <a href="/groups" style="color:var(--blue);font-weight:700;">分组</a>
</nav>
<div class="container">
    <div class="header-row">
        <h2 style="margin:0;font-size:1.3rem;">📁 股票分组</h2>
        <span id="groupCount" style="font-size:.82rem;color:var(--t3);"></span>
    </div>
    <div class="category-nav">
        <button class="category-btn active" onclick="filterGroups('all')">全部</button>
    </div>
    <div class="sort-nav">
        <span class="sort-label">排序:</span>
        <button class="sort-btn active" onclick="sortGroups('default')" id="sort-default">默认</button>
        <button class="sort-btn" onclick="sortGroups('avgChangeDesc')" id="sort-avgChangeDesc">涨幅 ↑</button>
        <button class="sort-btn" onclick="sortGroups('avgChangeAsc')" id="sort-avgChangeAsc">涨幅 ↓</button>
    </div>
    <div class="groups-grid" id="groupsGrid">
        <div style="text-align:center;padding:2rem;color:var(--t3);grid-column:1/-1;">加载中...</div>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay" style="display:none;">
    <div class="loading-box">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">正在计算分组涨幅...</div>
    </div>
</div>

<script>
let allGroups = [];
let stockPriceCache = {};
let currentCategory = 'all';
let currentSort = 'default';

async function loadGroups() {
    try {
        const resp = await fetch('/api/groups');
        const data = await resp.json();
        allGroups = data.groups || [];
        document.getElementById('groupCount').textContent = `共 ${allGroups.length} 个分组`;

        const catSet = new Set();
        allGroups.forEach(g => { if(g.category) catSet.add(g.category); });
        const categories = ['全部', ...Array.from(catSet).sort()];

        document.querySelector('.category-nav').innerHTML = categories.map(c =>
            `<button class="category-btn${c==='全部'?' active':''}" onclick="filterGroups('${c}')">${c}</button>`
        ).join('');

        // 收集所有股票代码
        const allCodes = [];
        allGroups.forEach(g => {
            (g.stocks || []).forEach(s => {
                const code = s.code || s;
                if (code && !allCodes.includes(code)) allCodes.push(code);
            });
        });

        // 获取实时行情
        if (allCodes.length > 0) {
            await fetchStockPrices(allCodes);
        }

        // 计算每个分组的平均涨幅
        calculateGroupAvgChanges();

        renderGroups(allGroups);
    } catch(e) {
        document.getElementById('groupsGrid').innerHTML =
            '<div style="text-align:center;padding:2rem;color:var(--t3);grid-column:1/-1;">加载失败</div>';
    }
}

async function fetchStockPrices(codes) {
    showLoading('正在获取行情数据...');
    try {
        const batchSize = 50;
        for (let i = 0; i < codes.length; i += batchSize) {
            const batch = codes.slice(i, i + batchSize);
            const codesStr = batch.join(',');
            const resp = await fetch(`/api/stock-prices?codes=${encodeURIComponent(codesStr)}`);
            const data = await resp.json();
            Object.assign(stockPriceCache, data);
        }
    } catch(e) {
        console.error('获取行情失败:', e);
    }
    hideLoading();
}

function calculateGroupAvgChanges() {
    allGroups.forEach(g => {
        const stocks = g.stocks || [];
        if (!stocks.length) {
            g.avgChange = null;
            return;
        }
        let totalChange = 0;
        let validCount = 0;
        stocks.forEach(s => {
            const code = s.code || s;
            const priceData = stockPriceCache[code];
            if (priceData && typeof priceData.pct === 'number') {
                totalChange += priceData.pct;
                validCount++;
            }
        });
        g.avgChange = validCount > 0 ? round(totalChange / validCount, 2) : null;
        g.avgChangeValidCount = validCount;
        g.avgChangeTotalCount = stocks.length;
    });
}

function round(num, digits) {
    return Math.round((num + Number.EPSILON) * Math.pow(10, digits)) / Math.pow(10, digits);
}

function formatChange(val) {
    if (val === null || val === undefined) return '--';
    const sign = val > 0 ? '+' : '';
    return `${sign}${val}%`;
}

function getChangeClass(val) {
    if (val === null || val === undefined) return 'flat';
    if (val > 0) return 'up';
    if (val < 0) return 'down';
    return 'flat';
}

function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `${r},${g},${b}`;
}

function getFilteredGroups() {
    let groups = currentCategory === 'all' || currentCategory === '全部'
        ? [...allGroups]
        : allGroups.filter(g => g.category === currentCategory);

    if (currentSort === 'avgChangeDesc') {
        groups.sort((a, b) => {
            const av = a.avgChange === null ? -Infinity : a.avgChange;
            const bv = b.avgChange === null ? -Infinity : b.avgChange;
            return bv - av;
        });
    } else if (currentSort === 'avgChangeAsc') {
        groups.sort((a, b) => {
            const av = a.avgChange === null ? Infinity : a.avgChange;
            const bv = b.avgChange === null ? Infinity : b.avgChange;
            return av - bv;
        });
    }
    return groups;
}

function renderGroups(groups) {
    const grid = document.getElementById('groupsGrid');
    if (!groups.length) {
        grid.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--t3);grid-column:1/-1;">暂无分组</div>';
        return;
    }

    grid.innerHTML = groups.map(g => {
        const color = g.color || '#00ffff';
        const stocks = g.stocks || [];
        const avgChangeHtml = g.avgChange !== null
            ? `<div class="group-avg-change ${getChangeClass(g.avgChange)}">${formatChange(g.avgChange)}</div>`
            : '';

        const stocksHtml = stocks.slice(0, 8).map(s => {
            const name = typeof s === 'string' ? s : (s.name || s.code || s);
            const code = s.code || name;
            const priceData = stockPriceCache[code];
            let changeHtml = '';
            if (priceData && typeof priceData.pct === 'number') {
                const cls = priceData.pct > 0 ? 'up' : (priceData.pct < 0 ? 'down' : 'flat');
                const sign = priceData.pct > 0 ? '+' : '';
                changeHtml = `<span class="stock-tag-change ${cls}">${sign}${priceData.pct}%</span>`;
            }
            return `<a href="/stock/${encodeURIComponent(code)}" class="stock-tag" style="background:rgba(${hexToRgb(color)},.12);color:${color};" onclick="event.stopPropagation();">${name.substring(0,6)}${changeHtml}</a>`;
        }).join('');
        const more = stocks.length > 8 ? ` +${stocks.length - 8}` : '';

        return `
        <div class="group-card" onclick="location.href='/group/${g.id}'" style="border-left:3px solid ${color};">
            ${avgChangeHtml}
            <div style="display:flex;align-items:center;gap:.5rem;padding-right:4.5rem;">
                <span style="font-size:1.3rem;">${g.icon || '📁'}</span>
                <span style="font-weight:700;font-size:.95rem;color:${color};">${g.name}</span>
                ${g.category ? `<span style="font-size:.7rem;background:rgba(${hexToRgb(color)},.15);color:${color};padding:.15rem .4rem;border-radius:10px;">${g.category}</span>` : ''}
                <span style="font-size:.72rem;color:var(--t3);margin-left:auto;">${stocks.length}只</span>
            </div>
            ${g.description ? `<div style="font-size:.75rem;color:var(--t3);line-height:1.4;margin-top:.5rem;">${g.description.substring(0,80)}${g.description.length>80?'...':''}</div>` : ''}
            <div class="group-stocks">${stocksHtml}${more ? `<span style="font-size:.72rem;color:var(--t3);">${more}</span>` : ''}</div>
        </div>`;
    }).join('');
}

function filterGroups(cat) {
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    currentCategory = cat === 'all' || cat === '全部' ? 'all' : cat;
    renderGroups(getFilteredGroups());
}

function sortGroups(sortType) {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`sort-${sortType}`).classList.add('active');
    currentSort = sortType;
    renderGroups(getFilteredGroups());
}

function showLoading(text) {
    document.getElementById('loadingText').textContent = text;
    document.getElementById('loadingOverlay').style.display = 'flex';
}

function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
}

// 每2分钟自动刷新行情
setInterval(async () => {
    const allCodes = [];
    allGroups.forEach(g => {
        (g.stocks || []).forEach(s => {
            const code = s.code || s;
            if (code && !allCodes.includes(code)) allCodes.push(code);
        });
    });
    if (allCodes.length > 0) {
        await fetchStockPrices(allCodes);
        calculateGroupAvgChanges();
        renderGroups(getFilteredGroups());
    }
}, 120000);

loadGroups();
</script>
</body>
</html>
