<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票分组</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0a0e17;
    --bg-card: rgba(15,22,35,.9);
    --border: rgba(59,130,246,.15);
    --blue: #3b82f6;
    --t1: #e2e8f0;
    --t2: #94a3b8;
    --t3: #64748b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--t1); min-height:100vh; }
.container { max-width:1200px; margin:0 auto; padding:1rem; }
nav { display:flex; align-items:center; gap:1rem; padding:.75rem 0; border-bottom:1px solid var(--border); margin-bottom:1.5rem; }
nav a { color:var(--t2); text-decoration:none; font-size:.85rem; font-weight:500; }
nav a:hover { color:var(--blue); }
nav .brand { font-weight:700; font-size:1rem; color:var(--t1); }
.category-nav { display:flex; flex-wrap:wrap; gap:.5rem; margin:1rem 0; }
.category-btn { padding:.4rem .8rem; border-radius:20px; border:1px solid var(--border); background:var(--bg-card); color:var(--t2); cursor:pointer; font-size:.78rem; font-weight:600; transition:all .2s; }
.category-btn:hover, .category-btn.active { background:var(--blue); color:#fff; border-color:var(--blue); }
.groups-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:1rem; margin:1rem 0; }
.group-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:1.25rem; cursor:pointer; transition:all .2s; }
.group-card:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.3); }
.group-stocks { display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.75rem; }
.stock-tag { padding:.2rem .5rem; border-radius:4px; font-size:.72rem; text-decoration:none; white-space:nowrap; }
.header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem; flex-wrap:wrap; gap:.5rem; }
@media(max-width:768px){ .groups-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<nav>
    <a href="/" class="brand">📊 Stock Research</a>
    <a href="/">首页</a>
    <a href="/groups" style="color:var(--blue);font-weight:700;">分组</a>
</nav>

<div class="container">
    <div class="header-row">
        <h2 style="margin:0;font-size:1.3rem;">📁 股票分组</h2>
        <span id="groupCount" style="font-size:.82rem;color:var(--t3);"></span>
    </div>

    <div class="category-nav">
        <button class="category-btn active" onclick="filterGroups('all')">全部</button>
    </div>

    <div class="groups-grid" id="groupsGrid">
        <div style="text-align:center;padding:2rem;color:var(--t3);grid-column:1/-1;">加载中...</div>
    </div>
</div>

<script>
let allGroups = [];

async function loadGroups() {
    try {
        const resp = await fetch('/api/groups');
        const data = await resp.json();
        allGroups = data.groups || [];
        document.getElementById('groupCount').textContent = `共 ${allGroups.length} 个分组`;
        
        const catSet = new Set();
        allGroups.forEach(g => { if(g.category) catSet.add(g.category); });
        const categories = ['全部', ...Array.from(catSet).sort()];
        
        document.querySelector('.category-nav').innerHTML = categories.map(c => 
            `<button class="category-btn${c==='全部'?' active':''}" onclick="filterGroups('${c}')">${c}</button>`
        ).join('');
        
        renderGroups(allGroups);
    } catch(e) {
        document.getElementById('groupsGrid').innerHTML = 
            '<div style="text-align:center;padding:2rem;color:var(--t3);grid-column:1/-1;">加载失败</div>';
    }
}

function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `${r},${g},${b}`;
}

function renderGroups(groups) {
    const grid = document.getElementById('groupsGrid');
    if (!groups.length) {
        grid.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--t3);grid-column:1/-1;">暂无分组</div>';
        return;
    }
    
    grid.innerHTML = groups.map(g => {
        const color = g.color || '#3b82f6';
        const stocks = g.stocks || [];
        const stocksHtml = stocks.slice(0, 8).map(s => {
            const name = typeof s === 'string' ? s : (s.name || s.code || s);
            const code = s.code || name;
            return `<a href="/stock/${encodeURIComponent(code)}" class="stock-tag" style="background:rgba(${hexToRgb(color)},.12);color:${color};">${name.substring(0,6)}</a>`;
        }).join('');
        const more = stocks.length > 8 ? ` +${stocks.length - 8}` : '';
        
        return `
        <div class="group-card" onclick="location.href='/group/${g.id}'" style="border-left:3px solid ${color};">
            <div style="display:flex;align-items:center;gap:.5rem;">
                <span style="font-size:1.3rem;">${g.icon || '📁'}</span>
                <span style="font-weight:700;font-size:.95rem;color:${color};">${g.name}</span>
                ${g.category ? `<span style="font-size:.7rem;background:rgba(${hexToRgb(color)},.15);color:${color};padding:.15rem .4rem;border-radius:10px;">${g.category}</span>` : ''}
                <span style="font-size:.72rem;color:var(--t3);margin-left:auto;">${stocks.length}只</span>
            </div>
            ${g.description ? `<div style="font-size:.75rem;color:var(--t3);line-height:1.4;margin-top:.5rem;">${g.description.substring(0,80)}${g.description.length>80?'...':''}</div>` : ''}
            <div class="group-stocks">${stocksHtml}${more ? `<span style="font-size:.72rem;color:var(--t3);">${more}</span>` : ''}</div>
        </div>`;
    }).join('');
}

function filterGroups(cat) {
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderGroups(cat === '全部' ? allGroups : allGroups.filter(g => g.category === cat));
}

loadGroups();
</script>
</body>
</html>
